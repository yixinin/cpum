name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            architecture: x64
            # x64: use the standard GitHub-hosted Windows runner (Windows
            # Server 2022, x86_64). It has x64 MSVC build tools pre-installed.
            runner: windows-latest
          - target: aarch64-pc-windows-msvc
            architecture: arm64
            # ARM64: use the GitHub-hosted ARM64 Windows runner
            # (`windows-11-arm`) so we build natively and avoid needing the
            # ARM64 MSVC toolchain on an x64 host. If this label is not
            # enabled for the org, see the fallback below.
            runner: windows-11-arm
            # Fallback when `windows-11-arm` is not available: keep
            # `runner: windows-latest` here and uncomment the "Install ARM64
            # MSVC build tools" step in the jobs block to cross-compile from
            # an x64 runner. (This adds 5-10 minutes of one-time toolchain
            # install per fresh runner image.)

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # ----------------------------------------------------------------
      # FALLBACK (only needed if you revert the ARM64 entry to
      # `runner: windows-latest` because `windows-11-arm` is not enabled
      # for this org). Uncomment the step below to install the ARM64 MSVC
      # build tools on the x64 runner before cross-compiling.
      # ----------------------------------------------------------------
      # - name: Install ARM64 MSVC build tools (cross-compile fallback)
      #   if: matrix.target == 'aarch64-pc-windows-msvc'
      #   shell: pwsh
      #   run: |
      #     $Installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_buildtools.exe"
      #     if (-not (Test-Path $Installer)) {
      #       Invoke-WebRequest -Uri 'https://aka.ms/vs/17/release/vs_buildtools.exe' -OutFile "$env:TEMP\vs_buildtools.exe"
      #       $Installer = "$env:TEMP\vs_buildtools.exe"
      #     }
      #     & $Installer install --quiet --wait --norestart --nocache `
      #       --add Microsoft.VisualStudio.Component.VC.Tools.ARM64 `
      #       --add Microsoft.VisualStudio.Component.VC.Runtimes.ARM64.Spectre `
      #       --add Microsoft.VisualStudio.Component.Windows11SDK.22621
      #     Add-Content -Path "$env:GITHUB_PATH" -Value "${env:ProgramFiles(x86)}\Microsoft Visual Studio\2022\BuildTools\VC\Tools\MSVC\*\bin\Hostx64\arm64"

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          # The Rust workspace lives under src-tauri/ (its target dir is
          # src-tauri/target, not the repo-root target). cache-on-failure
          # keeps a usable cache even when a build partially fails.
          cache-on-failure: true
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build architecture-specific service
        shell: pwsh
        run: |
          # tauri-build (the desktop crate's build script) reads
          # `tauri.conf.json -> bundle.resources` and expects the service
          # binary at the host-relative `target/release/cpum_service.exe`.
          # `--target` puts cargo's output under `target/<triple>/release/`,
          # so we build there and then copy to the host-relative path.
          cargo build --manifest-path src-tauri/Cargo.toml --release --target ${{ matrix.target }} -p cpum-service --bin cpum_service
          Copy-Item "src-tauri/target/${{ matrix.target }}/release/cpum_service.exe" 'src-tauri/target/release/cpum_service.exe'

      - name: Set Tauri version from git tag
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          $path = 'src-tauri/tauri.conf.json'
          $json = Get-Content $path | ConvertFrom-Json
          $json.version = $version
          $json | ConvertTo-Json -Depth 10 | Set-Content $path -NoNewline
          Write-Host "Set tauri version to $version"

      - name: Build NSIS installer
        # Tauri reads `TAURI_SIGNING_PRIVATE_KEY` (and optional
        # `TAURI_SIGNING_PRIVATE_KEY_PASSWORD`) to produce updater artifacts
        # alongside the installer: `<name>.nsis.zip` and the matching `.sig`.
        # This workflow generates a per-architecture `latest.json`. When the secret is
        # absent the build still succeeds but no updater artifacts are
        # produced and the release step below skips them.
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: pwsh
        run: |
          $keySet = -not [string]::IsNullOrEmpty($env:TAURI_SIGNING_PRIVATE_KEY)
          $passwordSet = -not [string]::IsNullOrEmpty($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)
          if ($keySet -ne $passwordSet) {
            throw 'Configure both TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD, or remove both.'
          }
          if ($keySet) {
            $keyPath = Join-Path $env:RUNNER_TEMP 'cpum-tauri.key'
            [System.IO.File]::WriteAllText($keyPath, $env:TAURI_SIGNING_PRIVATE_KEY, [System.Text.UTF8Encoding]::new($false))
            $env:TAURI_SIGNING_PRIVATE_KEY_PATH = $keyPath
            $keyInfo = Get-Item $keyPath
            $keyLineCount = @(Get-Content $keyPath).Count
            Write-Host "Updater signing diagnostics: keyFileBytes=$($keyInfo.Length), keyLines=$keyLineCount, passwordSet=$passwordSet"
            Write-Host 'Effective updater override:'
            Get-Content src-tauri/tauri.conf.json | Select-String -Pattern 'createUpdaterArtifacts|pubkey' -Context 0,0
            npx tauri build --verbose --bundles nsis --target ${{ matrix.target }}
          } else {
            npx tauri build --bundles nsis --target ${{ matrix.target }} --config '{"bundle":{"createUpdaterArtifacts":false}}'
          }
          if ($LASTEXITCODE -ne 0) { throw "tauri build failed with exit code $LASTEXITCODE." }
          Write-Host 'Files generated under src-tauri/target after Tauri build:'
          Get-ChildItem 'src-tauri/target' -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '[\\/]bundle[\\/]' } |
            Select-Object FullName, Length, LastWriteTime

      - name: Prepare installer artifact
        # Carry the signing env vars forward so the PowerShell block below
        # can distinguish between "secret not configured" and "secret set
        # but tauri build silently skipped signing" (the latter is almost
        # always a wrong / missing TAURI_SIGNING_PRIVATE_KEY_PASSWORD).
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: pwsh
        run: |
          # Tauri writes Windows bundle output to its configured target directory,
          # even when the Rust binary itself is cross-compiled for a target triple.
          $targetRoot = 'src-tauri/target'
          $bundleRoot = "$targetRoot/release/bundle"
          $bundleDir = "$bundleRoot/nsis"
          $installer = Get-ChildItem $targetRoot -Recurse -File -Filter '*-setup.exe' |
            Where-Object { $_.FullName -match '[\\/]bundle[\\/]nsis[\\/]' } |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $installer) { throw 'Tauri did not produce an NSIS installer.' }
          New-Item -ItemType Directory -Force -Path 'release-artifact/installer' | Out-Null
          Copy-Item $installer.FullName "release-artifact/installer/CPU-Manager_${{ github.ref_name }}_windows-${{ matrix.architecture }}-setup.exe"

          # Collect updater artifacts. Their presence depends on a chain of
          # preconditions in `tauri build`; an empty glob is not a diagnosis,
          # so report exactly which link in the chain is broken.
          $archives = @(Get-ChildItem $targetRoot -Recurse -File -Filter '*.nsis.zip' -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending)
          $archive = $archives | Select-Object -First 1
          $signature = if ($archive) {
            Get-Item "$($archive.FullName).sig" -ErrorAction SilentlyContinue
          }
          $keySet       = -not [string]::IsNullOrEmpty($env:TAURI_SIGNING_PRIVATE_KEY)
          $passwordSet  = -not [string]::IsNullOrEmpty($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)
          Write-Host "Updater artifact scan: keySet=$keySet passwordSet=$passwordSet archiveCount=$($archives.Count)"
          Write-Host 'All updater candidates:'
          Get-ChildItem $targetRoot -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match '\.(nsis\.zip|nsis\.zip\.sig|sig)$' } |
            Select-Object FullName, Length, LastWriteTime
          if ($keySet -ne $passwordSet) { throw 'Tauri updater signing configuration is incomplete.' }
          if ($keySet -and (-not $archive -or -not $signature)) {
            if (-not $archive) {
              throw 'Updater diagnosis: no .nsis.zip was generated. Tauri did not create an updater archive; inspect the verbose build log for createUpdaterArtifacts/config and signing warnings.'
            }
            throw "Updater diagnosis: archive exists but matching signature is missing. Archive=$($archive.FullName); expected signature=$($archive.FullName).sig"
          }
          if ($keySet) {
            New-Item -ItemType Directory -Force -Path "release-artifact/updater-${{ matrix.architecture }}" | Out-Null
            $archiveName = "CPU-Manager_${{ github.ref_name }}_windows-${{ matrix.architecture }}.nsis.zip"
            $archivePath = "release-artifact/updater-${{ matrix.architecture }}/$archiveName"
            Copy-Item $archive.FullName $archivePath
            Copy-Item $signature.FullName "$archivePath.sig"

            $platform = if ('${{ matrix.architecture }}' -eq 'arm64') { 'windows-aarch64' } else { 'windows-x86_64' }
            $version = '${{ github.ref_name }}' -replace '^v', ''
            $signatureText = (Get-Content $signature.FullName -Raw).Trim()
            $manifest = [ordered]@{
              version = $version
              pub_date = [DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ss.fffZ')
              platforms = [ordered]@{
                $platform = [ordered]@{
                  signature = $signatureText
                  url = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$archiveName"
                }
              }
            }
            $manifest | ConvertTo-Json -Depth 10 | Set-Content "release-artifact/updater-${{ matrix.architecture }}/latest-${{ matrix.architecture }}.json"
            Write-Host "Prepared signed updater artifacts for ${{ matrix.architecture }}."
          } else {
            # No updater files on disk. Diagnose which precondition is missing
            # so the user does not have to guess between secret, password, or
            # pubkey mismatch.
            $pubkeyInConf = -not [string]::IsNullOrEmpty(((Get-Content 'src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json).plugins.updater.pubkey))
            $reasons = New-Object System.Collections.Generic.List[string]
            if (-not $keySet)      { $reasons.Add('TAURI_SIGNING_PRIVATE_KEY secret is empty (set it in repo Settings > Secrets and variables > Actions)') }
            if ($passwordSet) { $reasons.Add('TAURI_SIGNING_PRIVATE_KEY_PASSWORD is set but TAURI_SIGNING_PRIVATE_KEY is empty') }
            if ($reasons.Count -eq 0) {
              $reasons.Add('tauri build did not produce updater artifacts even though the env vars are set; most likely the password is wrong, or the pubkey in tauri.conf.json does not match the private key. Re-run with ACTIONS_STEP_DEBUG=true to see the bundler warning.')
            }
            Write-Host "::warning::No updater artifacts for ${{ matrix.architecture }}. Likely cause(s):"
            foreach ($r in $reasons) { Write-Host "::warning::  - $r" }
          }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.architecture }}-installer
          path: release-artifact/installer/*
          if-no-files-found: error

      - name: Upload updater artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.architecture }}-updater
          path: release-artifact/updater-${{ matrix.architecture }}/*
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: windows-latest
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
      SIGNPATH_PROJECT_SLUG: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
      SIGNPATH_SIGNING_POLICY_SLUG: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
      SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: ${{ secrets.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}

    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          pattern: windows-*-installer
          merge-multiple: true
          path: unsigned-installers

      - name: Download updater artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: windows-*-updater
          merge-multiple: true
          path: updater-artifacts
          # If signing is disabled, no updater artifact exists. The action
          # leaves the destination empty and downstream steps skip it.

      - name: Detect SignPath configuration
        id: signing-config
        shell: pwsh
        run: |
          $required = @(
            $env:SIGNPATH_API_TOKEN,
            $env:SIGNPATH_ORGANIZATION_ID,
            $env:SIGNPATH_PROJECT_SLUG,
            $env:SIGNPATH_SIGNING_POLICY_SLUG,
            $env:SIGNPATH_ARTIFACT_CONFIGURATION_SLUG
          )
          $configured = @($required | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
          if ($configured.Count -eq 0) {
            'enabled=false' >> $env:GITHUB_OUTPUT
          } elseif ($configured.Count -eq $required.Count) {
            'enabled=true' >> $env:GITHUB_OUTPUT
          } else {
            throw 'SignPath configuration is incomplete. Configure all five SignPath secrets or remove them all to publish an unsigned release.'
          }

      - name: Upload installers for SignPath
        id: upload-unsigned-installers
        if: ${{ steps.signing-config.outputs.enabled == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-installers-for-signpath
          path: unsigned-installers/*-setup.exe
          if-no-files-found: error

      - name: Request SignPath signatures
        if: ${{ steps.signing-config.outputs.enabled == 'true' }}
        uses: SignPath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ env.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ env.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-installers.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-installers

      - name: Verify installer signatures
        if: ${{ steps.signing-config.outputs.enabled == 'true' }}
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem 'signed-installers' -Recurse -Filter '*-setup.exe')
          if ($installers.Count -ne 2) { throw 'SignPath did not return both signed installers.' }
          foreach ($installer in $installers) {
            $signature = Get-AuthenticodeSignature $installer.FullName
            if ($signature.Status -ne 'Valid') {
              throw "Installer signature is not valid: $($installer.Name): $($signature.Status)"
            }
          }

      - name: Prepare release artifacts
        shell: pwsh
        env:
          SIGNING_ENABLED: ${{ steps.signing-config.outputs.enabled }}
        run: |
          $sourceRoot = if ($env:SIGNING_ENABLED -eq 'true') { 'signed-installers' } else { 'unsigned-installers' }
          $installers = @(Get-ChildItem $sourceRoot -Recurse -Filter '*-setup.exe')
          if ($installers.Count -ne 2) { throw "Expected two installers under $sourceRoot." }
          New-Item -ItemType Directory -Force -Path 'release-artifacts' | Out-Null
          Copy-Item $installers.FullName 'release-artifacts/'

          # Pull in any updater artifacts (zipped installers, signatures,
          # per-arch latest.json). When the build matrix was run without
          # TAURI_SIGNING_PRIVATE_KEY the directory is absent and we skip
          # this section entirely.
          $downloadedUpdaterFiles = @(Get-ChildItem 'updater-artifacts' -Recurse -File -ErrorAction SilentlyContinue)
          if ($downloadedUpdaterFiles.Count -gt 0) {
            $downloadedUpdaterFiles | Copy-Item -Destination 'release-artifacts/'

            # The build jobs generate one latest.json per architecture, each
            # with a single `platforms` entry. Merge them so the published
            # `latest.json` (at the endpoint configured in
            # `tauri.conf.json`) advertises every Windows architecture in
            # the same release.
            $latestFiles = @(Get-ChildItem 'release-artifacts' -Filter 'latest-*.json')
            if ($latestFiles.Count -ne 2) { throw "Expected two updater manifests, found $($latestFiles.Count)." }
            if ($latestFiles.Count -gt 1) {
              $combined = [ordered]@{
                version  = $null
                pub_date = $null
                platforms = [ordered]@{}
              }
              foreach ($file in ($latestFiles | Sort-Object Name)) {
                $json = Get-Content $file.FullName -Raw | ConvertFrom-Json
                if (-not $combined.version) {
                  $combined.version  = $json.version
                  $combined.pub_date = $json.pub_date
                }
                foreach ($prop in $json.platforms.PSObject.Properties) {
                  $combined.platforms[$prop.Name] = $prop.Value
                }
              }
              $combined | ConvertTo-Json -Depth 20 | Set-Content 'release-artifacts/latest.json'
              $latestFiles | Remove-Item
            } elseif ($latestFiles.Count -eq 1) {
              # Single-arch build: just rename so the endpoint path is stable.
              Move-Item $latestFiles[0].FullName 'release-artifacts/latest.json'
            }
          } else {
            Write-Host 'No updater artifacts to publish.'
          }

      - name: Generate SHA256SUMS
        shell: pwsh
        # Emit a portable `sha256sum -c` compatible manifest over every file
        # we are about to publish. LF line endings and no BOM, so users on
        # macOS / Linux can verify the release without manual conversion.
        run: |
          $lines = [System.Collections.Generic.List[string]]::new()
          Get-ChildItem 'release-artifacts' -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            $lines.Add("$hash  $($_.Name)")
          }
          $content = ($lines -join "`n") + "`n"
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText('release-artifacts/SHA256SUMS.txt', $content, $utf8NoBom)
          Get-Content 'release-artifacts/SHA256SUMS.txt'

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-artifacts/*-setup.exe
            release-artifacts/*.nsis.zip
            release-artifacts/*.nsis.zip.sig
            release-artifacts/latest.json
            release-artifacts/SHA256SUMS.txt
